backend:
  name: git-gateway
  branch: main # Yadi GitHub repo main ho bhane main, natra master

media_folder: "images" # Upload gareko photo basne folder
public_folder: "/images"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - file: "index.html"
        label: "Home Page"
        name: "index"
        fields:
          - {label: "Site Title", name: "title", widget: "string"}
          - {label: "Welcome Text", name: "welcome_message", widget: "text"}
