backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - file: "index.html"
        label: "Home Page"
        name: "index"
        fields:
          - { label: "Site Title", name: "title", widget: "string" }
          - { label: "Welcome Text", name: "welcome_message", widget: "text" }
          - { label: "Services Title", name: "services_title", widget: "string" }
          - label: "Services"
            name: "services"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
          - { label: "Contact Phone", name: "phone", widget: "string" }
          - { label: "Contact Email", name: "email", widget: "string" }
